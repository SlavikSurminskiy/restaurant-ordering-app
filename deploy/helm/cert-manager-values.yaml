# cert-manager: gets TLS certificates from Let's Encrypt and renews them. Installed with Helm from
# the project's OCI registry (no `helm repo add` needed):
#   helm install cert-manager oci://quay.io/jetstack/charts/cert-manager --version v1.21.3 -n cert-manager --create-namespace -f deploy/helm/cert-manager-values.yaml

# Install the CustomResourceDefinitions (Certificate, ClusterIssuer, ...) with the chart.
crds:
  enabled: true

# Small requests: each node has about 0.9 CPU for pods.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
