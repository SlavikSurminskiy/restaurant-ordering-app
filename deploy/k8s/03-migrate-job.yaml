# One-off migration run: `prisma migrate deploy` against the database, then the pod exits.
#   kubectl apply -f deploy/k8s/03-migrate-job.yaml
# A Job's pod template cannot be changed, so to run it again by hand (a new image tag):
#   kubectl -n restaurant delete job migrate
#   kubectl apply -f deploy/k8s/03-migrate-job.yaml
# Argo CD (deploy/argocd/restaurant.yaml) does the same on every sync: see the annotations below.
#
# Names in this file and how they are linked:
#   migrate           Job name; its pod is migrate-<random suffix>
#   postgres          Secret created by hand (docs/deployment.md, step 4); the three keys are read one by one below
#   db                host name = the Service from 02-postgres.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: restaurant
  annotations:
    # For Argo CD this is a hook, not a resource to keep: it is created anew on every sync.
    argocd.argoproj.io/hook: Sync
    # The previous run's Job is deleted right before, so the same name can be used again.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Waves run in order, each waiting for the previous one to be healthy: Postgres and the rest
    # (wave 0) → this Job until it is Complete (1) → frontend and services (2) → Ingress (3). A failed migration stops the sync, and the old pods keep running.
    argocd.argoproj.io/sync-wave: '1'
spec:
  # A failed pod is replaced up to 4 times, with growing pauses (10 s, 20 s, 40 s, ...), e.g. while
  # the database is still starting. After that the Job is Failed.
  backoffLimit: 4
  # Stop the whole Job if it has not finished in 10 minutes.
  activeDeadlineSeconds: 600
  template:
    spec:
      # The container exits when the migrations are done; Never = don't restart it in the same pod
      # (failures are retried as new pods, see backoffLimit).
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/slaviksurminskiy/restaurant-migrate:4db1ed0
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            # $(NAME) is replaced by Kubernetes with the variables defined above in this list,
            # so the password is never written into a manifest.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          # The scheduler needs this much free CPU on a node before the pod can start, and the
          # nodes have little left (docs/microservices.md, resources). The migration runs for a
          # few seconds and mostly waits on Postgres, so a small request is enough; without a CPU
          # limit it can still use idle CPU.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 512Mi
