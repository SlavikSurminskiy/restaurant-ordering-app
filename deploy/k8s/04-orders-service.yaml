# Orders service (orders, 409 conflicts, the order-status timer): settings, one pod and an
# in-cluster address for it.
#   kubectl apply -f deploy/k8s/04-orders-service.yaml
#
# Names in this file and how they are linked:
#   orders-service-config  ConfigMap name; the Deployment loads all its keys as env variables
#   orders-service    Deployment name (pods are orders-service-<hash>-<suffix>) and Service name;
#                     the Ingress (07-ingress.yaml) sends /api/orders to this Service
#   role: orders      label; any key/value, it only has to be the same in the three places marked [L]
#   http              port name; the Service's targetPort and the probes refer to the container port by it
#   postgres, backend Secrets created by hand (docs/deployment.md, step 4); `backend` holds the
#                     JWT_SECRET every service shares (its name is older than the split)
#   db                host name = the Service from 02-postgres.yaml
#   menu-service      host name = the Service from 09-menu-service.yaml (prices for new orders)
#   realtime-gateway  host name = the Service from 10-realtime-gateway.yaml (order events)

# Non-secret settings. Values are always strings. Changing them does not restart running pods:
# run `kubectl -n restaurant rollout restart deployment orders-service` afterwards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
  namespace: restaurant
data:
  ORDER_STATUS_STEP_SECONDS: '20'
  # Where orders asks for prices, availability and the discount while placing an order.
  MENU_SERVICE_URL: http://menu-service:3002
  # Where order events go; the gateway streams them to browsers over SSE.
  EVENTS_URL: http://realtime-gateway:3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: restaurant
  annotations:
    # After the migrate Job (wave 1), with the other services; before the Ingress (wave 3).
    argocd.argoproj.io/sync-wave: '2'
spec:
  # Exactly one: the order-status timer runs in the process; two would race for the same orders.
  replicas: 1
  # Stop the old pod before starting the new one, so two timers never run at the same time
  # (the default RollingUpdate starts the new one first).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      role: orders # [L] which pods this Deployment owns
  template:
    metadata:
      labels:
        role: orders # [L] the label every created pod gets
    spec:
      # By default Kubernetes adds env variables for every Service in the namespace, including
      # ORDERS_SERVICE_PORT=tcp://<ip>:3000 for the Service `orders-service`. The app reads
      # ORDERS_SERVICE_PORT as the port to listen on and would crash with `listen EACCES ... tcp://...`.
      enableServiceLinks: false
      containers:
        - name: orders
          image: ghcr.io/slaviksurminskiy/restaurant-orders-service:3d0554f
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: orders-service-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            # $(NAME) is replaced with the variables defined above in this list.
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: JWT_SECRET
          # Until this passes, the pod gets no traffic from the Service.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          # If it fails 3 times in a row (about a minute), the container is restarted.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
---
# A stable in-cluster address (virtual IP + DNS name `orders-service`) in front of the pod, whose own IP
# changes every time it is recreated. Not reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: restaurant
spec:
  selector:
    role: orders # [L] sends traffic to pods with this label
  ports:
    - name: http
      port: 3000
      targetPort: http
