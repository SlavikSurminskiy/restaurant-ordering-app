# nginx with the Angular build: static files only, Traefik routes /api to the services.
#   kubectl apply -f deploy/k8s/05-frontend.yaml
#
# Names in this file and how they are linked:
#   frontend          Deployment name (pods are frontend-<hash>-<suffix>) and Service name; the
#                     entry point from outside (Traefik) will point to this Service
#   role: web         label; any key/value, it only has to be the same in the three places marked [L]
#   http              port name; the Service's targetPort and the probes refer to the container port by it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: restaurant
  annotations:
    # After the migrations (wave 1), with the other services.
    argocd.argoproj.io/sync-wave: '2'
spec:
  # Stateless, so it could run several replicas; one is enough here.
  replicas: 1
  selector:
    matchLabels:
      role: web # [L] which pods this Deployment owns
  template:
    metadata:
      labels:
        role: web # [L] the label every created pod gets
    spec:
      # No *_PORT/*_SERVICE_HOST variables for the Services in the namespace; nginx needs none.
      enableServiceLinks: false
      containers:
        - name: nginx
          image: ghcr.io/slaviksurminskiy/restaurant-frontend:4db1ed0
          ports:
            - name: http
              containerPort: 8080 # nginx-unprivileged listens on 8080, not 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
---
# A stable in-cluster address for nginx. Traefik will send internet traffic to it.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: restaurant
spec:
  selector:
    role: web # [L] sends traffic to pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
