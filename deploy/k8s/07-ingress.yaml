# The public address of the app: https://92-5-5-205.sslip.io -> Traefik -> a service by path.
#   kubectl apply -f deploy/k8s/07-ingress.yaml
#
# Names in this file and how they are linked:
#   92-5-5-205.sslip.io  sslip.io resolves it to 92.5.5.205, the IP of Traefik's load balancer
#                        (kubectl -n traefik get svc traefik); a new load balancer means a new IP
#   letsencrypt-prod     ClusterIssuer from 06-cluster-issuer.yaml; letsencrypt-staging while debugging
#   restaurant-tls       Secret where cert-manager puts the certificate; Traefik reads it from there
#   frontend, http       Service and port name from 05-frontend.yaml
#   auth-service         Service from 08-auth-service.yaml
#   menu-service         Service from 09-menu-service.yaml
#   realtime-gateway     Service from 10-realtime-gateway.yaml
#   orders-service       Service from 04-orders-service.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant
  namespace: restaurant
  annotations:
    # Argo CD applies it after wave 2 is healthy, so a path switches to a new service only once
    # its pods are ready.
    argocd.argoproj.io/sync-wave: '3'
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS only; on port 80 Traefik redirects to HTTPS (deploy/helm/traefik-values.yaml).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 92-5-5-205.sslip.io
      secretName: restaurant-tls
  rules:
    - host: 92-5-5-205.sslip.io
      http:
        paths:
          # The longest matching path wins, whatever the order here. Prefix matches whole path
          # segments: /api/auth and /api/auth/login, not /api/authors.
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
          # Server-Sent Events: Traefik passes the response on as it comes, without buffering.
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: realtime-gateway
                port:
                  name: http
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  name: http
          - path: /api/menu
            pathType: Prefix
            backend:
              service:
                name: menu-service
                port:
                  name: http
          - path: /api/discount
            pathType: Prefix
            backend:
              service:
                name: menu-service
                port:
                  name: http
          # Everything else goes to nginx: the app's static files.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
