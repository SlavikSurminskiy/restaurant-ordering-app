# Production-like stack from the Docker images: Postgres → migrate → orders-service, auth-service,
# menu-service and realtime-gateway → frontend, with Traefik in front routing by path like the Ingress in deploy/k8s/07-ingress.yaml.
# Separate from the development docker-compose.yml: own project name, volume and ports.
#   cp .env.prod.example .env.prod   # then set real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# App: http://localhost:8080

name: restaurant-prod

# Built from the POSTGRES_* variables; a password with URL-reserved characters (@ : / ? #)
# must be percent-encoded.
x-database-url: &database-url postgresql://${POSTGRES_USER:?set in .env.prod}:${POSTGRES_PASSWORD:?set in .env.prod}@postgres:5432/${POSTGRES_DB:?set in .env.prod}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    # Only for the seed and psql from this machine: bound to localhost, never to the network.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `up` and exits; the services start only if it exits with 0.
  migrate:
    build:
      context: .
      dockerfile: libs/database/Dockerfile
    image: restaurant-migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    build:
      context: .
      dockerfile: apps/backend/orders-service/Dockerfile
    image: restaurant-orders-service
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod (at least 32 characters)}
      MENU_SERVICE_URL: http://menu-service:3002
      EVENTS_URL: http://realtime-gateway:3003
      ORDER_STATUS_STEP_SECONDS: ${ORDER_STATUS_STEP_SECONDS:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image has no curl; Node's fetch does the same.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.orders.rule: Path(`/api/orders`) || PathPrefix(`/api/orders/`)
      traefik.http.services.orders.loadbalancer.server.port: '3000'

  # Signs the JWT; the other services verify it with the same JWT_SECRET.
  auth-service:
    build:
      context: .
      dockerfile: apps/backend/auth-service/Dockerfile
    image: restaurant-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod (at least 32 characters)}
      JWT_TTL: ${JWT_TTL:-28800}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image has no curl; Node's fetch does the same.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      traefik.enable: 'true'
      # Same as the Ingress rule: /api/auth and everything under it, not /api/authors.
      traefik.http.routers.auth.rule: Path(`/api/auth`) || PathPrefix(`/api/auth/`)
      traefik.http.services.auth.loadbalancer.server.port: '3001'

  # Menu, categories, dishes and discount; sends menu events to the gateway for SSE.
  menu-service:
    build:
      context: .
      dockerfile: apps/backend/menu-service/Dockerfile
    image: restaurant-menu-service
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod (at least 32 characters)}
      ORDER_DISCOUNT: ${ORDER_DISCOUNT:-500}
      EVENTS_URL: http://realtime-gateway:3003
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image has no curl; Node's fetch does the same.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.menu.rule: Path(`/api/menu`) || PathPrefix(`/api/menu/`) || Path(`/api/discount`)
      traefik.http.services.menu.loadbalancer.server.port: '3002'

  # SSE for browsers; orders-service and menu-service POST events to it. No database.
  realtime-gateway:
    build:
      context: .
      dockerfile: apps/backend/realtime-gateway/Dockerfile
    image: restaurant-realtime-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod (at least 32 characters)}
    # The image has no curl; Node's fetch does the same.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.realtime.rule: Path(`/api/events`)
      traefik.http.services.realtime.loadbalancer.server.port: '3003'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: restaurant-frontend
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_healthy
    labels:
      traefik.enable: 'true'
      # Traefik tries longer rules first, so this one catches what the auth rule does not.
      traefik.http.routers.web.rule: PathPrefix(`/`)
      traefik.http.services.web.loadbalancer.server.port: '8080'

  # The entry point, like Traefik in the cluster. It reads the routes from the labels above
  # through the Docker API; only containers with traefik.enable=true get one.
  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:8080
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    volumes:
      # Read-only, but the Docker API still gives full control over the host's containers: fine
      # on a development machine, not on a shared server.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      orders-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres-data:
