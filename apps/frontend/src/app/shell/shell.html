<mat-toolbar class="shell__toolbar">
  <span class="shell__title">Restaurant Ordering</span>

  @if (discount() > 0) {
    <div class="shell__discount">
      <mat-icon class="shell__discount-icon" aria-hidden="true">sell</mat-icon>
      <span>{{ discount() | money }} off every order</span>
    </div>
  }

  <app-connection-indicator class="shell__connection" />
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
</main>
