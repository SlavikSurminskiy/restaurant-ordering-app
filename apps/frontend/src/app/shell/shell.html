<mat-toolbar class="shell__toolbar">
  <app-navigation class="shell__nav" />

  <div class="shell__center">
    @if (discount() > 0) {
      <div class="shell__discount">
        <mat-icon class="shell__discount-icon" aria-hidden="true"
          >sell</mat-icon
        >
        <span>{{ discount() | money }} off every order</span>
      </div>
    }
    <app-connection-indicator />
  </div>

  <div class="shell__end">
    <app-cart-button />
    <app-account />
  </div>
</mat-toolbar>

<main class="shell__content">
  <router-outlet />
</main>
