@if (store.user(); as user) {
  <a matButton routerLink="/orders">Orders</a>
  @if (store.isAdmin()) {
    <a matButton routerLink="/setup-menu">Setup menu</a>
  }
  <span class="account__user">
    <mat-icon aria-hidden="true">account_circle</mat-icon>
    <span>{{ user.name }}</span>
  </span>
  <button matButton type="button" (click)="signOut()">Sign out</button>
} @else {
  <a matButton routerLink="/login">Sign in</a>
}
