<mat-card appearance="outlined" class="status">
  <mat-card-header>
    <mat-card-title>System status</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (health.isLoading()) {
    <mat-spinner diameter="32" />
    } @else if (health.error()) {
    <p>API: down</p>
    } @else if (health.value(); as data) {
    <p>API: {{ data.status }}</p>
    <p>Database: {{ data.database }}</p>
    }
  </mat-card-content>
</mat-card>
